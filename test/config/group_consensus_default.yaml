agent_group_config:
  type: "GroupConsensusQMIX"
  agent_list:
    agent_0: model1
    agent_1: model1
    agent_2: model1
  model_configs:
    model1:
      feature_extractor:
        model_type: "Custom"
        layers:
        - type: Linear
          in_features: 18
          out_features: 32
      group_estimate_feature_extractor:
        model_type: "Custom"
        layers:
        - type: Linear
          in_features: 18
          out_features: 16
      encoder:
        model_type: "Custom"
        layers:
        - type: Linear
          in_features: 40
          out_features: 128
      decoder:
        model_type: "Custom"
        layers:
        - type: Linear
          in_features: 128
          out_features: 5
  group_builder_config:
    type: "Fixed"
    group_ids: [0, 0, 1]
  deterministic_eval: true
  enable_rl_grad_to_group_estimate: false
  optimizer:
    type: "Adam"
    lr: 0.0005
    weight_decay: 0.0001

env_config:
  module_name: "mpe2"
  env_name: "simple_spread_v3"

critic_config:
  type: "GroupConsensusMixer"
  feature_extractor:
    model_type: "Custom"
    layers:
    - type: Linear
      in_features: 54
      out_features: 32
  consensus_processor:
    model_type: "HyperNetwork"
    cond_dim: 32
    layer_dims: [24, 32, 32]
    cond_hidden_dim: 64
  model:
    model_type: "QMixModel"
    state_shape: 32
    input_dim: 3
    qmix_hidden_dim: 128
  num_agents: 3
  group_latent_dim: 8
  deterministic_eval: true
  optimizer:
    type: "Adam"
    lr: 0.0005
    weight_decay: 0.0001

rollout_config:
  manager_type: "multi-process"
  worker_type: "multi-process"
  n_workers: 8
  n_episodes: 1000
  n_eval_episodes: 100
  traj_len: 7
  episode_limit: 500
  device: "cpu"

replaybuffer_config:
  type: "Normal"
  capacity: 50000
  traj_len: 7

analyzer_config:
  type: "default"

trainer_config:
  type: "GroupConsensusQMIX"
  gamma: 0.95
  eval_epsilon: 0.01
  workdir: "./test/results/group_consensus_default"
  train_device: "cpu"
  kl_divergence_weight: 0.005
  warmup_epochs: 5

  epsilon_scheduler:
    type: "logarithmic"
    start_value: 1.0
    end_value: 0.05
    decay_steps: 100

  sample_ratio_scheduler:
    type: "linear"
    start_value: 1.0
    end_value: 0.3
    decay_steps: 100

  train_args:
    epochs: 100
    target_first_metric: 100
    eval_interval: 1
    batch_size: 128
    learning_times_per_epoch: 1
