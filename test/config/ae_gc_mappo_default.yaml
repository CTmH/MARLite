agent_group:
  type: "GroupConsensusMAPPO"
  deterministic_eval: true
  enable_rl_grad_to_group_estimate: false
  consensus_mode: "ae"
  merge_mode: "bayesian"
  agent_list:
    agent_0: model1
    agent_1: model1
    agent_2: model1
  models:
    model1:
      group_estimate_feature_extractor:
        model_type: "Custom"
        layers:
          - type: "Linear"
            in_features: 18
            out_features: 9
      feature_extractor:
        model_type: "Identity"
      encoder:
        model_type: "Custom"
        layers:
          - type: "Linear"
            in_features: 18
            out_features: 55
          - type: "ReLU"
      decoder:
        model_type: "Custom"
        layers:
          - type: "Linear"
            in_features: 64
            out_features: 5
  group_builder:
    type: "Fixed"
    group_ids: [0, 0, 0]
  optimizer:
    type: "Adam"
    lr: 0.0005
    weight_decay: 0.0001

environment:
  module_name: "mpe2"
  env_name: "simple_spread_v3"

critic:
  type: "MAPPOCritic"
  model:
    model_type: "Custom"
    layers:
      - type: "Linear"
        in_features: 54
        out_features: 32
      - type: "ReLU"
      - type: "Linear"
        in_features: 32
        out_features: 1
  feature_extractor:
    model_type: "Identity"
  optimizer:
    type: "Adam"
    lr: 0.0005
    weight_decay: 0.0001

rollout:
  manager_type: "multi-process"
  worker_type: "multi-process"
  n_workers: 8
  n_episodes: 1000
  n_eval_episodes: 100
  traj_len: 7
  episode_limit: 500
  device: "cpu"

replay_buffer:
  type: "Normal"
  capacity: 50000
  traj_len: 7

analyzer:
  type: "default"

self_supervised_learning:
  model:
    model_type: "Custom"
    layers:
      - type: "Linear"
        in_features: 9
        out_features: 32
      - type: "ReLU"
      - type: "Linear"
        in_features: 32
        out_features: 18
  optimizer:
    type: "Adam"
    lr: 0.0005
    weight_decay: 0.0001
  lr_scheduler:
    type: "ReduceLROnPlateau"
    mode: "max"
    factor: 0.5
    patience: 8
    min_lr: 0.000001
  data_constructor:
    type: "MagentVecObs"
    max_entities_perception: 1
    n_workers: 0
  reconstruction_loss:
    type: "MSE"

trainer:
  type: "SSLGroupConsensusMAPPO"
  gamma: 0.99
  workdir: "./test/results/ae_gc_mappo"
  train_device: "cpu"
  clip_epsilon: 0.2
  gae_lambda: 0.95
  entropy_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 5.0
  consensus_mode: "ae"
  kl_divergence_weight: 0
  recon_mode: "per_group"
  kl_on_agent: false
  kl_on_group: false
  warmup_iterations: 0

  sample_ratio_scheduler:
    type: "linear"
    start_value: 1.0
    end_value: 0.3
    decay_steps: 100

  train_args:
    iterations: 100
    target_first_metric: -9999
    batch_size: 128
    learning_times_per_iteration: 4