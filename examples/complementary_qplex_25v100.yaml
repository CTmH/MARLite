rollout:
  victory_checker: complementary
  manager_type: persistent-env
  worker_type: persistent-env
  n_workers: 2
  n_episodes: 8
  n_eval_episodes: 8
  traj_len: 4
  episode_limit: 200
  device: cpu
  required_attrs: complementary_qmix
replay_buffer:
  type: Normal
  capacity: 64
  traj_len: 4
  required_attrs: complementary_qmix
analyzer:
  type: complementary
trainer:
  eval_metric_list: [capture_fraction]
  type: QPLEX
  seed: 42
  gamma: 0.99
  n_workers: 0
  max_grad_norm: 5.0
  train_device:
  - cuda:0
  - cuda:1
  workdir: ./results/complementary_qplex_25v100
  reward_aggr_mode: mean
  eval_epsilon: 0.0
  eval_episodes_to_replay_ratio: 0.0
  target_update_mode: hard
  target_update_interval: 200
  sample_mode: direct
  sample_ratio_scheduler:
    type: fixed
    value: 1024
  epsilon_scheduler:
    type: linear
    start_value: 1.0
    end_value: 0.05
    ramp_start_step: 0
    ramp_steps: 100
  train_args:
    epochs: 300
    target_first_metric: 1.1
    rollback_interval: 301
    batch_size: 32
    learning_times_per_epoch: 2
