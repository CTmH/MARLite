agent_group:
  type: "MAPPO"
  agent_list:
    agent_0: model1
    agent_1: model1
    agent_2: model1
  models:
    model1:
      feature_extractor:
        model_type: "Identity"
      model:
        model_type: "RNN"
        input_shape: 18
        rnn_hidden_dim: 128
        rnn_layers: 1
        output_shape: 5
  optimizer:
    type: "Adam"
    lr: 0.0005
    weight_decay: 0.0001

environment:
  module_name: "mpe2"
  env_name: "simple_spread_v3"
  env_params:
    max_cycles: 100
    N: 3
    local_ratio: 0.5

critic:
  type: "MAPPOCritic"
  model:
    model_type: "Custom"
    layers:
      - type: "Linear"
        in_features: 54
        out_features: 128
      - type: "ReLU"
      - type: "Linear"
        in_features: 128
        out_features: 128
      - type: "ReLU"
      - type: "Linear"
        in_features: 128
        out_features: 1
  feature_extractor:
    model_type: "Identity"
  optimizer:
    type: "Adam"
    lr: 0.0005
    weight_decay: 0.0001

rollout:
  manager_type: "multi-process"
  worker_type: "multi-process"
  n_workers: 8
  n_episodes: 500
  n_eval_episodes: 100
  traj_len: 5
  episode_limit: 300
  device: "cpu"

replay_buffer:
  type: "Normal"
  capacity: 50000
  traj_len: 5

trainer:
  type: "MAPPO"
  gamma: 0.99
  workdir: "./test/results/mappo_default"
  train_device: "cpu"
  clip_epsilon: 0.2
  gae_lambda: 0.95
  entropy_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 5.0

  sample_ratio_scheduler:
    type: "linear"
    start_value: 1.0
    end_value: 0.3
    ramp_start_step: 0
    ramp_steps: 100

  train_args:
    iterations: 100
    target_first_metric: -9999
    batch_size: 128
    learning_times_per_iteration: 4

analyzer:
  type: "default"
