# Sequence API v3. Small examples, not tuned paper settings.
version: 3
recipe: qmix
seed: 42
environment:
  module: mpe2.simple_spread_v3
  params:
    N: 3
    max_cycles: 25
    continuous_actions: false
defaults:
  hidden_dim: 32
  mixing_dim: 16
  heads: 4
  learning_rate: 0.0005
collector:
  max_steps: 25
learner:
  burn_in: 16
  state_strategy: zero_burnin
trainer:
  sequence_length: 16
  batch_sequences: 16
  updates_per_iteration: 4
run:
  iterations: 1000
  train_episodes: 8
  eval_episodes: 16
  eval_interval: 10
  checkpoint_interval: 50
replay:
  capacity: 256
  sampling: uniform
actor:
  type: SequenceAgentGroup
  params:
    frame_encoder:
      type: Sequential
      params:
        layers:
        - type: Flatten
          params:
            start_dim: 1
        - type: Linear
          params:
            in_features:
              $dim: observation_size
            out_features: 32
        - type: GELU
    temporal:
      type: RecurrentGRU
      params:
        input_dim: 32
        hidden_dim: 32
    action_head:
      type: Linear
      params:
        in_features: 48
        out_features:
          $dim: action_dim
    output_kind: q_values
    communication:
      type: GaussianConsensus
      params:
        latent_dim: 16
        n_groups:
          $dim: n_agents
        mode: bayesian
    message_encoder:
      type: Linear
      params:
        in_features: 32
        out_features: 32
    detach_fusion: true
communication_context:
  type: AllTogether
auxiliary:
  objective:
    type: ReconstructionObjective
    params:
      decoder:
        type: Linear
        params:
          in_features: 16
          out_features:
            $dim: observation_size
      targets:
        type: ObservationTargets
        params:
          scope: group
      source: group
      variational: true
      group_kl: 0.001
      agent_kl: 0.001
  optimizer:
    type: Adam
    params:
      lr: 0.001
  mixer:
    type: WeightedSumLoss
    params:
      weights:
      - 1.0
      - 0.1
