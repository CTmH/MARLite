# Sequence API v3. Small examples, not tuned paper settings.
version: 3
recipe: qmpd
seed: 42
environment:
  module: mpe2.simple_spread_v3
  params:
    N: 3
    max_cycles: 25
    continuous_actions: false
defaults:
  hidden_dim: 32
  mixing_dim: 16
  heads: 4
  learning_rate: 0.0005
collector:
  max_steps: 25
learner:
  burn_in: 8
  state_strategy: cached_burnin
trainer:
  sequence_length: 16
  batch_sequences: 16
  ppo_epochs: 4
run:
  iterations: 1000
  train_episodes: 8
  eval_episodes: 16
  eval_interval: 10
  checkpoint_interval: 50
teacher:
  source: train
  trainer:
    sequence_length: 16
    batch_sequences: 16
    ppo_epochs: 4
  run:
    iterations: 1000
    train_episodes: 8
    eval_episodes: 16
    eval_interval: 10
    checkpoint_interval: 50
  online_distillation:
    enabled: false
    weight: 0.1
    decay_updates: 1000
offline:
  train_episodes: 32
  validation_episodes: 16
  codec_updates: 600
  policy_updates: 200
  offline_batch_sequences: 32
  replacement: all
