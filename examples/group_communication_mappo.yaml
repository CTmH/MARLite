# Interface smoke test; state-threshold queries are not capture labels.
agent_group:
  type: GroupCommunicationMAPPO
  agent_list:
    agent_0: model1
    agent_1: model1
    agent_2: model1
  optimizer:
    type: Adam
    lr: 0.0005
    weight_decay: 0.0001
  observation_dim: 18
  action_dim: 5
  hidden_dim: 32
  heads: 4
  slots: 8
  message_dim: 32
  bits: 4
  use_np: true
  query_dim: 4
  latent_dim: 8
  hyper_rank: 0
  message_mode: quantized
  group_builder:
    type: Fixed
    group_ids:
    - 0
    - 0
    - 0
  relation_targets:
    indices:
    - 0
    - 1
    queries:
    - - 1
      - 0
      - 0
      - 0
    - - 0
      - 1
      - 0
      - 0
    thresholds:
    - 0
    - 0
environment:
  module_name: mpe2
  env_name: simple_spread_v3
critic:
  type: MAPPOCritic
  model:
    model_type: Custom
    layers:
    - type: Linear
      in_features: 54
      out_features: 128
    - type: ReLU
    - type: Linear
      in_features: 128
      out_features: 128
    - type: ReLU
    - type: Linear
      in_features: 128
      out_features: 1
  feature_extractor:
    model_type: Identity
  optimizer:
    type: Adam
    lr: 0.0005
    weight_decay: 0.0001
rollout:
  manager_type: multi-process
  worker_type: multi-process
  n_workers: 1
  n_episodes: 1
  n_eval_episodes: 1
  traj_len: 4
  episode_limit: 8
  device: cpu
  required_attrs: group_communication_mappo
replay_buffer:
  type: Normal
  capacity: 5
  traj_len: 4
  required_attrs: group_communication_mappo
analyzer:
  type: default
trainer:
  type: MAPPO
  gamma: 0.99
  workdir: ./results/group_communication_mappo
  train_device: cpu
  clip_epsilon: 0.2
  gae_lambda: 0.95
  entropy_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 5.0
  sample_ratio_scheduler:
    type: linear
    start_value: 16
    end_value: 16
    ramp_start_step: 0
    ramp_steps: 10
  train_args:
    iterations: 1
    target_first_metric: 1000
    batch_size: 8
    learning_times_per_iteration: 1
  seed: 42
